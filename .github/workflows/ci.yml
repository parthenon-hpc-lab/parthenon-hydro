name: github-linux

# This is Parthenon-Hydro's *only* CI workflow. The same jobs run for its
# own PRs/pushes and when Parthenon calls them as downstream integration tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      hydro_ref:
        description: 'Parthenon-Hydro revision (e.g. main)'
        type: string
        required: false
        default: ''
      parthenon_ref:
        description: 'Optional Parthenon override (e.g. refs/pull/123/merge)'
        type: string
        required: false
        default: ''
      run_only:
        description: 'Skip build matrix'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Use a different prefix from the Parthenon caller to avoid a reusable-
# workflow concurrency collision. Superseded PR runs are canceled.
concurrency:
  group: hydro-ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-host:
    if: ${{ !inputs.run_only }}
    strategy:
      fail-fast: false
      matrix:
        cxx: ['g++', 'clang++-20']
        cmake_build_type: ['Release', 'Debug']
        device: ['cuda', 'host']
        parallel: ['serial', 'mpi']
        exclude:
          # Remove builds that are used during testing stage
          - cxx: g++
            device: host
            cmake_build_type: Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/parthenon-hpc-lab/cuda12.8-mpi-hdf5-opmd
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Checkout Parthenon-Hydro
        uses: actions/checkout@v4
        with:
          repository: parthenon-hpc-lab/parthenon-hydro
          ref: ${{ inputs.hydro_ref || github.ref }}
          submodules: false
          persist-credentials: false
      - name: Checkout pinned dependencies
        env:
          PARTHENON_REF: ${{ inputs.parthenon_ref }}
        run: |
          git submodule update --init external/Kokkos
          if [ -z "$PARTHENON_REF" ]; then
            git submodule update --init external/parthenon
          fi
      - name: Checkout candidate Parthenon
        if: ${{ inputs.parthenon_ref != '' }}
        uses: actions/checkout@v4
        with:
          repository: parthenon-hpc-lab/parthenon
          ref: ${{ inputs.parthenon_ref }}
          path: external/parthenon
          submodules: recursive
          persist-credentials: false
      - name: Show exact revisions
        run: |
          echo "Hydro: $(git rev-parse HEAD)"
          echo "Parthenon: $(git -C external/parthenon rev-parse HEAD)"
          echo "Kokkos: $(git -C external/Kokkos rev-parse HEAD)"
      - name: CMake
        run: |
          cmake -B builddir \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
            -DMACHINE_CFG=${PWD}/external/parthenon/cmake/machinecfg/GitHubActions.cmake \
            -DMACHINE_VARIANT=${{ matrix.device }}_${{ matrix.parallel }}
      - name: Build
        run: cmake --build builddir --parallel 2

  test-host:
    strategy:
      fail-fast: false
      matrix:
        parallel: ['serial', 'mpi']
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/parthenon-hpc-lab/cuda12.8-mpi-hdf5-opmd
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Checkout Parthenon-Hydro
        uses: actions/checkout@v4
        with:
          repository: parthenon-hpc-lab/parthenon-hydro
          ref: ${{ inputs.hydro_ref || github.ref }}
          submodules: false
          persist-credentials: false
      - name: Checkout pinned dependencies
        env:
          PARTHENON_REF: ${{ inputs.parthenon_ref }}
        run: |
          git submodule update --init external/Kokkos
          if [ -z "$PARTHENON_REF" ]; then
            git submodule update --init external/parthenon
          fi
      - name: Checkout candidate Parthenon
        if: ${{ inputs.parthenon_ref != '' }}
        uses: actions/checkout@v4
        with:
          repository: parthenon-hpc-lab/parthenon
          ref: ${{ inputs.parthenon_ref }}
          path: external/parthenon
          submodules: recursive
          persist-credentials: false
      - name: Show exact revisions
        run: |
          echo "Hydro: $(git rev-parse HEAD)"
          echo "Parthenon: $(git -C external/parthenon rev-parse HEAD)"
          echo "Kokkos: $(git -C external/Kokkos rev-parse HEAD)"
      - name: CMake
        run: |
          cmake -B builddir \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DMACHINE_CFG=${PWD}/external/parthenon/cmake/machinecfg/GitHubActions.cmake \
            -DMACHINE_VARIANT=host_${{ matrix.parallel }} \
            -DNUM_MPI_PROC_TESTING=2
      - name: Build and test
        run: |
          cmake --build builddir --parallel 2
          cd builddir
          ctest --output-on-failure
